<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James Whiting Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Gallery -->
  <div id="gallery"></div>
  <div id="gallery-click" aria-label="Next image"></div>

  <!-- Navigation -->
  <nav id="nav">
    <a href="#" id="nav-info">Information</a>
    <a href="#" id="nav-contact">Contact</a>
  </nav>

  <!-- Information overlay -->
  <div id="info-overlay" aria-hidden="true">
    <div id="info-nav">
      <a href="#" id="info-close">Home</a>
    </div>
    <div id="info-content">
      <p id="info-bio"></p>
      <p id="info-clients"></p>
      <div id="info-links">
        <a id="info-instagram" href="#" target="_blank" rel="noopener noreferrer"></a>
        <a id="info-email" href="#"></a>
      </div>
    </div>
  </div>

  <!-- Contact modal -->
  <div id="contact-overlay" aria-hidden="true">
    <div id="contact-modal">
      <form id="contact-form">
        <input type="email" name="from" placeholder="your@email.com" required autocomplete="email">
        <textarea name="message" placeholder="Write your message..." required rows="6"></textarea>
        <div id="contact-actions">
          <button type="button" id="contact-cancel">Cancel</button>
          <button type="submit" id="contact-send">Send</button>
        </div>
      </form>
      <p id="contact-status"></p>
    </div>
  </div>

  <!-- Admin panel -->
  <button id="ap-trigger" hidden title="Admin">&#9632;</button>

  <div id="ap-panel" hidden>
    <div id="ap-header">
      <div id="ap-tabs">
        <button class="ap-tab active" data-tab="style">Style</button>
        <button class="ap-tab" data-tab="content">Content</button>
        <button class="ap-tab" data-tab="gallery">Gallery</button>
        <button class="ap-tab" data-tab="settings">Settings</button>
      </div>
      <button id="ap-close">&#x2715;</button>
    </div>

    <div id="ap-body">

      <!-- Style -->
      <div class="ap-section active" id="ap-style">
        <label class="ap-label">
          Font size <span id="ap-size-val"></span>
          <input type="range" id="ap-size" min="2" max="7" step="0.1">
        </label>
        <label class="ap-label">
          Weight
          <select id="ap-weight">
            <option value="400">400 Regular</option>
            <option value="500">500 Medium</option>
            <option value="600">600 Semibold</option>
            <option value="700">700 Bold</option>
            <option value="800">800 Extrabold</option>
            <option value="900">900 Black</option>
          </select>
        </label>
        <label class="ap-label">
          Letter spacing <span id="ap-kerning-val"></span>
          <input type="range" id="ap-kerning" min="-0.1" max="0.2" step="0.005">
        </label>
        <label class="ap-label">
          Line height <span id="ap-lh-val"></span>
          <input type="range" id="ap-lh" min="0.7" max="1.5" step="0.025">
        </label>
      </div>

      <!-- Content -->
      <div class="ap-section" id="ap-content">
        <label class="ap-label">
          Navigation — Information link
          <input type="text" id="ap-nav-info">
        </label>
        <label class="ap-label">
          Navigation — Contact link
          <input type="text" id="ap-nav-contact">
        </label>
        <label class="ap-label">
          Nav font size <span id="ap-nav-size-val"></span>
          <input type="range" id="ap-nav-size" min="0.6" max="2" step="0.05">
        </label>
        <label class="ap-label">
          Nav weight
          <select id="ap-nav-weight">
            <option value="400">400 Regular</option>
            <option value="500">500 Medium</option>
            <option value="600">600 Semibold</option>
            <option value="700">700 Bold</option>
            <option value="800">800 Extrabold</option>
          </select>
        </label>
        <div class="ap-divider"></div>
        <label class="ap-label">
          Biography
          <textarea id="ap-bio" rows="4"></textarea>
        </label>
        <label class="ap-label">
          Clients
          <textarea id="ap-clients" rows="4"></textarea>
        </label>
        <label class="ap-label">
          Instagram handle
          <input type="text" id="ap-instagram">
        </label>
        <label class="ap-label">
          Instagram URL
          <input type="url" id="ap-instagram-url">
        </label>
        <label class="ap-label">
          Email
          <input type="email" id="ap-email">
        </label>
      </div>

      <!-- Gallery -->
      <div class="ap-section" id="ap-gallery">
        <div id="ap-upload-row">
          <button id="ap-upload-btn">+ Upload</button>
          <input type="file" id="ap-file-input" multiple accept="image/jpeg,image/png,image/webp" hidden>
          <button id="ap-delete-selected" hidden>Delete selected</button>
        </div>
        <div id="ap-image-grid"></div>
      </div>

      <!-- Settings -->
      <div class="ap-section" id="ap-settings">
        <label class="ap-label ap-toggle-label">
          Auto-advance
          <label class="ap-toggle">
            <input type="checkbox" id="ap-auto">
            <span class="ap-toggle-slider"></span>
          </label>
        </label>
        <label class="ap-label" id="ap-interval-label">
          Interval (seconds)
          <input type="number" id="ap-interval" min="1" max="60">
        </label>
        <div class="ap-divider"></div>
        <label class="ap-label">
          Current password
          <input type="password" id="ap-pw-current">
        </label>
        <label class="ap-label">
          New password
          <input type="password" id="ap-pw-new">
        </label>
        <label class="ap-label">
          Confirm
          <input type="password" id="ap-pw-confirm">
        </label>
      </div>

    </div>

    <div id="ap-footer">
      <button id="ap-logout">Sign out</button>
      <div id="ap-footer-right">
        <span id="ap-status"></span>
        <button id="ap-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
